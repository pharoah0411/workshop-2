<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medicine Inventory (SQL Server API)</title>
    <script src="med_manager.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 30px; }
        .medicines-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #0066ff; }
    </style>
</head>
<body>
    <h1>🏥 Pharmacy Inventory <small>(SQL Server API Mode)</small></h1>
    
    <div style="margin-bottom: 20px;">
        <input type="text" id="apiSearch" placeholder="Search medicines..." oninput="refreshUI()" style="padding:12px; width:350px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div id="medicinesList" class="medicines-list">
        <p>Loading medicines...</p>
    </div>

    <script>
        async function refreshUI() {
            const container = document.getElementById('medicinesList');
            const search = document.getElementById('apiSearch').value;

            // Fetch through the MedManager bridge
            const medicines = await MedManager.load('all', search);

            if (medicines.length === 0) {
                container.innerHTML = "<p>No data found. Ensure api_medicine.php is working.</p>";
                return;
            }

            container.innerHTML = medicines.map(m => `
                <div class="card">
                    <h3>${m.name}</h3>
                    <p>ID: <code>${m.id}</code></p>
                    <p>Stock: <strong>${m.stock}</strong></p>
                    <p>Price: $${Number(m.price).toFixed(2)}</p>
                </div>
            `).join('');
        }

        window.onload = refreshUI;
    </script>
</body>
</html>
