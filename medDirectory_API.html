<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medicine Inventory (SQL Server API)</title>
    <script src="med_manager.js?v=2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 40px; }
        .medicines-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #0066ff; }
    </style>
</head>
<body>
    <h1>🏥 Pharmacy Inventory <small>(SQL Server API Mode)</small></h1>
    
    <div id="medicinesList" class="medicines-list">
        <p>Loading medicines from SQL Server...</p>
    </div>

    <script>
        async function refreshUI() {
            const container = document.getElementById('medicinesList');
            const medicines = await MedManager.load();

            if (medicines.length === 0) {
                container.innerHTML = "<p>No data found. Check Browser Console (F12) for error messages.</p>";
                return;
            }

            container.innerHTML = medicines.map(m => `
                <div class="card">
                    <h3>${m.name}</h3>
                    <p>ID: <code>${m.id}</code></p>
                    <p>Stock: <strong>${m.stock}</strong> units</p>
                    <p>Price: $${Number(m.price).toFixed(2)}</p>
                    <p><small>Expires: ${m.expiryDate}</small></p>
                </div>
            `).join('');
        }

        window.onload = refreshUI;
    </script>
</body>
</html>
